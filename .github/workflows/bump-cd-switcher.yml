name: Bump cd-switcher cask

# Point the cask at the latest cd-switcher GitHub release. Runs in this repo so
# it can commit with the default token; no cross-repo secret is required.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update cask from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release=$(gh api repos/lavluda/cd-switcher/releases/latest)
          tag=$(jq -r .tag_name <<<"$release")
          version=${tag#v}
          asset=$(jq -c '.assets[] | select(.name=="cd-switcher-darwin-universal.dmg")' <<<"$release")
          if [ -z "$asset" ]; then
            echo "latest release has no cd-switcher-darwin-universal.dmg; skipping"
            exit 0
          fi
          sha=$(jq -r '.digest // empty' <<<"$asset")
          sha=${sha#sha256:}
          if [ -z "$sha" ] || [ "$sha" = "null" ]; then
            url=$(jq -r .browser_download_url <<<"$asset")
            sha=$(curl -fsSL "$url" | sha256sum | awk '{print $1}')
          fi
          cask=Casks/cd-switcher.rb
          current=$(sed -n 's/^  version "\(.*\)"/\1/p' "$cask")
          current_sha=$(sed -n 's/^  sha256 "\(.*\)"/\1/p' "$cask")
          if [ "$current" = "$version" ] && [ "$current_sha" = "$sha" ]; then
            echo "cask already at $version"
            exit 0
          fi
          sed -i "s/^  version \".*\"/  version \"$version\"/" "$cask"
          sed -i "s/^  sha256 \".*\"/  sha256 \"$sha\"/" "$cask"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$cask"
          git commit -m "Brew cask update for cd-switcher version $tag"
          git push
